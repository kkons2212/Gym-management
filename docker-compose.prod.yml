# ===================================================================
# DOCKER COMPOSE ORCHESTRATION CHO GYM MANAGEMENT SYSTEM (PRODUCTION)
# Điều phối 3 thành phần: SQL Server 2022, Server API và Web Portal
# ===================================================================

services:
  # -----------------------------------------------------------------
  # 1. CƠ SỞ DỮ LIỆU: SQL Server 2022 Developer / Express
  # -----------------------------------------------------------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gym-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SqlServer@2026}"
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-SqlServer@2026}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gym-network

  # -----------------------------------------------------------------
  # 2. BACKEND: ASP.NET Core Web API (GymManagement.Server.Api)
  # -----------------------------------------------------------------
  server-api:
    image: ${API_IMAGE:-ghcr.io/kkons2212/gymmanagement-server-api:latest}
    container_name: gym-server-api
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=GymManagementDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SqlServer@2026};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Issuer: "GymManagement.Server.Api"
      Jwt__Audience: "GymManagement.Clients"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-GymManagement_Super_Secret_Jwt_Signing_Key_2026_Secure!}"
    ports:
      - "${API_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gym-network

  # -----------------------------------------------------------------
  # 3. FRONTEND: Blazor Web Portal (GymManagement.Web)
  # -----------------------------------------------------------------
  web-portal:
    image: ${WEB_IMAGE:-ghcr.io/kkons2212/gymmanagement-web:latest}
    container_name: gym-web-portal
    restart: unless-stopped
    depends_on:
      server-api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8081"
      ApiSettings__BaseUrl: "http://server-api:8080"
    ports:
      - "${WEB_PORT:-5001}:8081"
    networks:
      - gym-network

volumes:
  mssql_data:
    name: gym_mssql_prod_data

networks:
  gym-network:
    name: gym_internal_network
    driver: bridge
